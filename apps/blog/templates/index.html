<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Главная страница</title>
  </head>
  <body>
    <h1>Список постов</h1>
    {% for post in posts %}
    <div>
      <h2>{{ post.title }}</h2>
      <p>{{ post.content }}</p>
      <small>{{ post.created_at|date:"d E Y H:i" }}</small>
    </div>
    <hr />
    {% empty %}
    <p>Постов пока нет.</p>
    {% endfor %}
  </body>
</html>
